<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <!-- Bell dome (left half dark, right half navy) -->
  <path d="M120 50 C 80 80, 80 150, 100 180 L 100 200 L 200 200 L 200 180 C 220 150, 220 80, 180 50 Z" fill="#2a2a3e" stroke="#1a1a2e" strokeWidth="1.5"/>
  <!-- Bell left dark -->
  <path d="M120 50 C 80 80, 80 150, 100 180 L 100 200 L 150 200 L 150 50 Z" fill="#222230"/>
  <!-- Bell right navy -->
  <path d="M150 50 L 150 200 L 200 200 L 200 180 C 220 150, 220 80, 180 50 Z" fill="#1a1a3e"/>
  <!-- Bell top knob -->
  <ellipse cx="150" cy="40" rx="16" ry="9" fill="#2a2a3e" stroke="#1a1a2e" strokeWidth="1.5"/>
  <line x1="150" y1="31" x2="150" y2="25" stroke="#1a1a2e" strokeWidth="2"/>
  <!-- Clapper bottom -->
  <circle cx="150" cy="215" r="9" fill="#2a2a3e" stroke="#1a1a2e" strokeWidth="1.5"/>
  <line x1="100" y1="200" x2="200" y2="200" stroke="#1a1a2e" strokeWidth="2.5"/>

  <!-- Map Indonesia INSIDE bell (cutout effect) -->
  <!-- Sumatra -->
  <path d="M105 120 Q 115 105, 130 110 L 125 145 Q 110 150, 105 120" fill="#f0a500" opacity="0.9"/>
  <!-- Java -->
  <path d="M115 165 Q 145 178, 185 165 L 175 185 Q 140 192, 115 165" fill="#f0a500" opacity="0.9"/>
  <!-- Kalimantan -->
  <path d="M160 105 L 175 100 Q 195 95, 200 110 L 185 130 Q 170 132, 160 105" fill="#f0a500" opacity="0.8"/>
  <!-- Sulawesi -->
  <path d="M195 115 L 210 105 Q 225 112, 215 125 L 200 128 Z" fill="#f0a500" opacity="0.8"/>
  <!-- Papua -->
  <path d="M225 100 Q 245 90, 265 100 L 275 130 Q 265 150, 255 165 L 235 160 Q 220 145, 225 100" fill="#f0a500" opacity="0.8"/>
  <!-- Small island dots -->
  <circle cx="145" cy="140" r="2" fill="#f0a500"/>
  <circle cx="210" cy="145" r="1.5" fill="#f0a500"/>
  <circle cx="255" cy="115" r="1.5" fill="#f0a500"/>

  <!-- Accent ring around bell -->
  <circle cx="150" cy="125" r="85" stroke="#f0a500" strokeWidth="1" opacity="0.25" fill="none"/>
  <circle cx="150" cy="125" r="95" stroke="#f0a500" strokeWidth="0.5" opacity="0.12" fill="none"/>
</svg>