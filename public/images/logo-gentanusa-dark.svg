  <path d="M30 160 Q 40 140, 60 145 L 50 180 Q 35 185, 30 160" stroke="#e8c840" strokeWidth="2" fill="rgba(232,200,64,0.1)" />
  <!-- Java -->
  <path d="M80 220 Q 120 245, 160 225 L 140 240 Q 100 245, 80 220" stroke="#e8c840" strokeWidth="2" fill="rgba(232,200,64,0.1)" />
