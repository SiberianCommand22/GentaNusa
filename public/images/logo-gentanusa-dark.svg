  <path d="M160 125 L 180 120 Q 200 110, 220 115 L 200 135 Q 180 140, 160 125" stroke="#e8c840" strokeWidth="2" fill="rgba(232,200,64,0.1)" />
  <!-- Sulawesi -->
  <path d="M220 130 L 240 115 Q 260 120, 250 140 L 230 145 Z" stroke="#e8c840" strokeWidth="2" fill="rgba(232,200,64,0.1)" />
  <!-- Papua -->
  <path d="M300 105 Q 320 90, 350 100 L 360 130 Q 350 150, 340 170 L 320 190 Q 300 200, 280 195" stroke="#e8c840" strokeWidth="2" fill="rgba(232,200,64,0.1)" />

  <!-- Small dots sebagai dekorasi pulau-pulau kecil -->
  <circle cx="70" cy="190" r="3" fill="#f0a500" opacity="0.6" />
  <circle cx="200" cy="200" r="2.5" fill="#f0a500" opacity="0.5" />
  <circle cx="280" cy="170" r="2" fill="#f0a500" opacity="0.4" />
  <circle cx="350" cy="120" r="2" fill="#f0a500" opacity="0.4" />

  <!-- Tulisan GentaNusa (opsional, bisa dihilangkan jika terlalu kecil) -->
  <text x="200" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#f0a500" font-weight="600">GentaNusa</text>
</svg>