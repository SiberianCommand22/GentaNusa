  <ellipse cx="120" cy="45" rx="22" ry="12" stroke="#f0a500" strokeWidth="3.5" fill="none" />
  <line x1="120" y1="57" x2="120" y2="68" stroke="#f0a500" strokeWidth="3" />
  <circle cx="120" cy="260" r="10" stroke="#f0a500" strokeWidth="3.5" fill="rgba(240,165,0,0.15)" />
  <line x1="120" y1="250" x2="120" y2="248" stroke="#f0a500" strokeWidth="3" />
  <line x1="70" y1="250" x2="170" y2="250" stroke="#f0a500" strokeWidth="3" />

  <!-- Map Indonesia outline (simplified) -->
  <path d="M30 160 Q 40 140, 60 145 L 80 130 Q 100 125, 120 135 L 140 120 Q 160 115, 180 125 L 200 110 Q 220 105, 240 115 L 260 100 Q 280 95, 300 105 L 320 90 Q 340 85, 350 100 L 360 130 Q 350 150, 340 170 L 320 190 Q 300 200, 280 195 L 260 210 Q 240 220, 220 215 L 200 230 Q 180 235, 160 225 L 140 240 Q 120 245, 100 235 L 80 220 Q 60 210, 50 195 Z" stroke="#e8c840" strokeWidth="2.5" fill="rgba(232,200,64,0.15)" />
